<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
  <!-- theme:start --><script>
// Applies the saved theme before styles and page content can paint.
(function () {
  function apply() {
    var theme = 'dark';
    try {
      var saved = JSON.parse(localStorage.getItem('hotpath.v1.settings') || '{}') || {};
      if (saved.theme === 'light' || saved.theme === 'dark') theme = saved.theme;
      else if (saved.theme === 'system' && saved.themeExplicit === true) {
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
    } catch (e) { /* Storage can be unavailable. */ }
    document.documentElement.dataset.theme = theme;
    var bar = document.querySelector('meta[name="theme-color"]');
    if (bar) bar.content = theme === 'dark' ? '#0A0E18' : '#EDF2F9';
  }
  apply();
  if (typeof matchMedia === 'function') matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', apply);
})();
</script><!-- theme:end -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Designer</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-content: center; gap: 12px; padding: 24px; text-align: center; font: 500 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #edf2f9; color: #1b2b45; }
  a { color: #244ed8; font-weight: 600; }
  :root[data-theme="dark"] body { background: #0e1422; color: #e6ebf5; } :root[data-theme="dark"] a { color: #8fa8ff; }
</style>
</head>
<body>
<h1>That page is not here</h1>
<p><a id="home" href="/">Open System Designer</a></p>
<script>
// A daily link for a date without its own page (d/YYYY-MM-DD/) still opens that day, with a design kept in the fragment.
(function () {
  var m = /^(.*\/)d\/(\d{4}-\d{2}-\d{2})\/?$/.exec(location.pathname);
  var home = m ? m[1] : '/';
  var h = location.hash || '';
  document.getElementById('home').href = home;
  if (m) location.replace(home + (h.indexOf('#/beat/') === 0 ? h : '#/challenge/' + m[2]));
})();
</script>
</body>
</html>
