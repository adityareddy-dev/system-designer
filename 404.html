<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
  <!-- theme:start --><script>
// The site has one theme, the cream workbench. Set before styles and page content can paint.
(function () {
  document.documentElement.dataset.theme = 'light';
  var bar = document.querySelector('meta[name="theme-color"]');
  if (bar) bar.content = '#FFF4E0';
})();
</script><!-- theme:end -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Designer</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: light; --paper: #FFF4E0; --card: #FFFCF4; --ink: #141414; --text-2: #33312C; --tomato: #FF5B3A; --blue: #2D5BFF; --yellow: #FFC93C; }
  @font-face { font-family: 'Space Grotesk'; font-weight: 400 700; font-display: swap; src: url('/assets/fonts/space-grotesk.woff2') format('woff2'); }
  @font-face { font-family: 'Space Mono'; font-weight: 400; font-display: swap; src: url('/assets/fonts/space-mono-400.woff2') format('woff2'); }
  @font-face { font-family: 'Space Mono'; font-weight: 700; font-display: swap; src: url('/assets/fonts/space-mono-700.woff2') format('woff2'); }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-content: center; justify-items: center; padding: 24px; text-align: center; font: 400 18px/1.55 "Space Grotesk", system-ui, sans-serif; background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased; }
  .nf-card { background: var(--card); border: 2px solid var(--ink); border-radius: 12px; box-shadow: 8px 8px 0 var(--ink); padding: 36px clamp(20px, 5vw, 48px); max-width: 520px; display: grid; justify-items: center; }
  .nf-mark { display: block; margin-bottom: 20px; }
  .nf-kicker { margin: 0 0 10px; font: 700 13px/1.5 "Space Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; }
  h1 { margin: 0 0 12px; font-size: clamp(32px, 6vw, 52px); line-height: 1; letter-spacing: -.035em; text-wrap: balance; }
  p { margin: 0; color: var(--text-2); max-width: 34ch; text-wrap: pretty; }
  .nf-action { margin-top: 28px; }
  #home { display: inline-flex; align-items: center; min-height: 52px; padding: 12px 22px; border: 2px solid var(--ink); border-radius: 6px; background: var(--tomato); color: var(--ink); font-weight: 700; text-decoration: none; box-shadow: 4px 4px 0 var(--ink); transition: transform 120ms ease, box-shadow 120ms ease; }
  #home:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
  #home:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--ink); }
  #home:focus-visible { outline: 3px solid var(--blue); outline-offset: 4px; }
  @media (prefers-reduced-motion: reduce) { #home { transition: none; } #home:hover { transform: none; } }
</style>
</head>
<body>
<div class="nf-card">
<svg class="nf-mark" viewBox="0 0 32 32" width="56" height="56" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="6" fill="#141414"/><path d="M11 14 20 10M11 18l9 4" stroke="#FFF4E0" stroke-width="2"/><circle cx="8.5" cy="16" r="3.5" fill="#FFC93C"/><circle cx="23" cy="8.5" r="3.5" fill="#FF5B3A"/><circle cx="23" cy="23.5" r="3.5" fill="#2D5BFF"/></svg>
<p class="nf-kicker">404 / No route to this page</p>
<h1>That page is not here</h1>
<p>The link may be old, or the address has a typo. The game and every lesson are one step away.</p>
<p class="nf-action"><a id="home" href="/">Open System Designer</a></p>
</div>
<script>
// A daily link for a date without its own page (d/YYYY-MM-DD/) still opens that day, with a design kept in the fragment.
(function () {
  var m = /^(.*\/)d\/(\d{4}-\d{2}-\d{2})\/?$/.exec(location.pathname);
  var home = m ? m[1] : '/';
  var h = location.hash || '';
  document.getElementById('home').href = home;
  if (m) location.replace(home + (h.indexOf('#/beat/') === 0 ? h : '#/challenge/' + m[2]));
})();
</script>
</body>
</html>
